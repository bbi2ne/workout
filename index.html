<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>운동로그 - 루틴 기록</title>
<style>
:root{color-scheme:dark;--lift:20px;
  --bg:#000;--glass:rgba(255,255,255,.075);--glass-s:rgba(28,28,30,.9);--gb:rgba(255,255,255,.12);
  --shadow:0 8px 30px rgba(0,0,0,.55);--ink:#fff;--mute:rgba(235,235,245,.6);--line:rgba(120,120,135,.3);
  --acc:#0a84ff;--accink:#fff;--accbg:rgba(10,132,255,.22);--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--input:rgba(120,120,128,.26);--card:var(--glass);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--bo);will-change:transform;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:68vmax;height:68vmax;left:-24vmax;top:-22vmax;background:var(--b1)}
.bg i:nth-child(2){width:58vmax;height:58vmax;right:-22vmax;top:16vh;background:var(--b2);animation-duration:23s;animation-delay:-6s}
.bg i:nth-child(3){width:56vmax;height:56vmax;left:2vw;bottom:-26vmax;background:var(--b3);animation-duration:27s;animation-delay:-11s}
.bg i:nth-child(4){width:40vmax;height:40vmax;right:8vw;bottom:6vh;background:var(--b4);animation-duration:21s;animation-delay:-3s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,-5vmax) scale(1.15)}}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(96px + var(--lift) + env(safe-area-inset-bottom))}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.6px;margin:14px 4px 4px;text-align:center}
.sub{margin:0 4px 14px;color:var(--mute);font-size:15px;text-align:center}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 8px 7px;letter-spacing:-.1px;text-align:center}
.card{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.flat{background:none;border:0;box-shadow:none;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--mute)}.sm{font-size:13px}.c{text-align:center}
.btn{border:0;background:var(--input);color:var(--acc);border-radius:13px;min-height:40px;padding:0 15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .16s cubic-bezier(.3,1.4,.5,1),opacity .16s,background .22s,color .22s}
.btn:active{transform:scale(.96);opacity:.75}
.btn.pri{background:var(--acc);color:var(--accink)}
.btn.soft{background:var(--accbg);color:var(--acc)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.ic{min-width:40px;padding:0 10px;font-size:18px}
.btn.big{width:100%;min-height:50px;font-size:17px;border-radius:15px;margin-bottom:12px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);vertical-align:middle}
.inp{width:100%;border:0;background:var(--input);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;min-width:0;min-height:42px}
.inp{transition:box-shadow .2s,background .2s}.inp:focus{outline:none;box-shadow:0 0 0 2px var(--acc)}
.inp.c{text-align:center}
.ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ih b{font-size:17px;letter-spacing:-.2px}
.ctl{display:flex;gap:5px;flex-shrink:0}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 42px 28px;gap:7px;align-items:center;margin:6px 0}
.setrow.kr{grid-template-columns:24px 1fr 1fr 28px}
.setrow.head{font-size:12px;color:var(--mute);text-align:center;margin-bottom:0}
.setrow .n{text-align:center;color:var(--mute);font-size:14px;font-weight:600}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:17px;font-weight:700;cursor:pointer;padding:0;transition:all .18s cubic-bezier(.3,1.6,.5,1)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.04)}
.chk:active{transform:scale(.9)}
.x{border:0;background:none;color:var(--mute);font-size:15px;cursor:pointer;padding:4px;opacity:.8}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--glass-s);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-top:1px solid var(--gb);display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + var(--lift))}
nav .in{display:flex;width:100%;max-width:640px}
nav button{transition:color .2s;flex:1;border:0;background:none;color:var(--mute);padding:8px 0 6px;font:inherit;font-size:10.5px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button:active{opacity:.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--glass-s);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);border:1px solid var(--gb);border-bottom:0;width:100%;max-width:640px;max-height:84vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(20px + var(--lift) + env(safe-area-inset-bottom));animation:up .4s cubic-bezier(.2,.9,.25,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:20px;letter-spacing:-.3px;text-align:center}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}@keyframes down{to{transform:translateY(100%)}}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}.li:active{opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);border-radius:20px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-size:24px;letter-spacing:-.5px}
.seg{display:flex;gap:2px;background:var(--input);padding:2px;border-radius:11px;margin-bottom:10px;overflow-x:auto}
.seg .btn{flex:1;white-space:nowrap;background:none;color:var(--ink);font-weight:500;min-height:32px;border-radius:9px;padding:0 10px;font-size:14px}
.seg .btn.on{background:var(--glass-s);box-shadow:0 2px 8px rgba(0,0,0,.14);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:50%;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;position:relative;padding:0}
.cal .d.has{background:var(--accbg)}
.cal .d.today{color:var(--acc);font-weight:700}
.cal .d.sel{background:var(--acc);color:var(--accink)}
.cal .d i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.bar{height:8px;border-radius:5px;background:var(--input);overflow:hidden}
.bar>div{height:100%;border-radius:5px;background:var(--acc)}
.pr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border:0}
.empty{padding:26px 8px;text-align:center;color:var(--mute)}
svg text{fill:var(--mute);font-size:9px}
svg .ln{stroke:var(--acc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg .gl{stroke:var(--line);stroke-width:1}
svg .pt{fill:var(--acc)}svg .bb{fill:var(--acc)}
textarea.inp{min-height:130px;font-size:12px;font-family:ui-monospace,monospace}
.sw{width:51px;height:31px;border-radius:99px;border:0;background:var(--input);position:relative;cursor:pointer;transition:background .2s;padding:0;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--lift) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--glass-s);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--gb);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow);animation:fade .2s}

/* ---- motion ---- */
nav button svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
nav button.on svg{transform:translateY(-1px) scale(1.14)}
.ov.out{animation:fadeout .24s forwards}.ov.out .sheet{animation:down .26s cubic-bezier(.4,0,1,1) forwards}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
.fold{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .42s cubic-bezier(.2,.85,.25,1),opacity .3s ease,visibility 0s}
.foldin{overflow:hidden;min-height:0}
.sfold>.fold{grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1),opacity .22s ease,visibility 0s .4s}
.fbtn{flex-shrink:0;width:40px;height:36px;border:0;border-radius:12px;background:var(--input);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s}
.fbtn:active{transform:scale(.9)}
.fbtn i{width:9px;height:9px;border-right:2.4px solid var(--acc);border-bottom:2.4px solid var(--acc);transform:translateY(-2px) rotate(45deg);transition:transform .38s cubic-bezier(.3,1.4,.5,1)}
.sfold .fbtn i{transform:translateX(-2px) rotate(-45deg)}
.foldsum{max-height:0;opacity:0;overflow:hidden;font-size:13px;color:var(--mute);white-space:nowrap;text-overflow:ellipsis;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
.sfold .foldsum{max-height:22px;opacity:1;margin-top:4px}
#quote{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13px);height:14px;line-height:14px;z-index:17;display:flex;align-items:center;justify-content:center;padding:0 14px;pointer-events:none;font-size:11px;color:var(--mute);opacity:0;transition:opacity .6s}
#quote.show{opacity:.78}#quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}#quote em{font-style:normal;opacity:.7}
.fresh{animation:popin .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(10px)}}
.leaving{transition:height .26s cubic-bezier(.4,0,.2,1),opacity .2s,transform .26s,margin .26s,padding .26s,border-width .26s;height:0!important;opacity:0;transform:scale(.94);margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;border-width:0;overflow:hidden}
.swap>*{animation:fadein .26s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}}
.chk.pulse{animation:checkpop .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes checkpop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1.04)}}
.card.li{transition:transform .18s cubic-bezier(.3,1.4,.5,1)}.card.li:active{transform:scale(.97)}
.li{transition:opacity .15s,background .2s}
.cal .d.fire{background:none;border:0;box-shadow:none;color:#5a2400;font-weight:800;font-size:13px;text-shadow:none;animation:none;z-index:0;overflow:visible;display:flex;align-items:center;justify-content:center;padding-top:15px}
.cal .d.fire .fr{position:absolute;left:50%;top:50%;width:38px;height:46px;margin:-27px 0 0 -19px;pointer-events:none;z-index:-1;transform-origin:50% 90%;animation:flk .55s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,120,0,.65))}
.fr svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes flk{from{transform:scale(.96,.94) rotate(-1.5deg)}to{transform:scale(1.04,1.07) rotate(1.5deg)}}
.cal .d.rest{background:radial-gradient(circle at 50% 35%,rgba(120,255,170,.22),rgba(48,209,88,.08) 70%);color:#8ff5b3;font-weight:700;border:1.5px solid rgba(110,240,160,.55);box-shadow:0 0 10px rgba(48,209,88,.28),inset 0 0 8px rgba(110,240,160,.18);animation:rbreath 3.6s ease-in-out infinite}
.cal .d.rest::after{content:'🌿';position:absolute;right:-3px;top:-4px;font-size:11px;transform:rotate(18deg);filter:drop-shadow(0 0 3px rgba(48,209,88,.7))}
@keyframes rbreath{0%,100%{box-shadow:0 0 8px rgba(48,209,88,.22),inset 0 0 6px rgba(110,240,160,.14)}50%{box-shadow:0 0 16px rgba(48,209,88,.5),inset 0 0 11px rgba(110,240,160,.3)}}
.wm{text-align:center;margin:26px 0 10px;font-size:12px;letter-spacing:.14em;font-weight:600;color:rgba(255,255,255,.3);text-shadow:0 0 10px rgba(255,255,255,.12)}
.aibox{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0 14px;padding:14px 16px;border:1.5px solid #30d158;border-radius:18px;background:rgba(48,209,88,.07);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 0 14px rgba(48,209,88,.18)}
.aibox>span:nth-child(2){flex:1}.aibox b{color:#6ef09a}.aibi{font-size:22px}
.aihead{margin:22px 2px 8px;font-weight:800;font-size:17px;color:#30d158}
.aiplan{border:1.5px solid rgba(48,209,88,.55);border-radius:20px;padding:12px;margin-bottom:12px;background:rgba(48,209,88,.04)}
.aiplan .card{margin-bottom:8px!important}
.card.aicard{border:1.5px solid rgba(48,209,88,.7)}
.chip.aitag{background:rgba(48,209,88,.18);color:#6ef09a}
.wz{display:flex;flex-direction:column;gap:10px}
.wopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;border:1.5px solid transparent;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;transition:border-color .2s,background .2s}
.wopt.col{flex-direction:column;align-items:flex-start;gap:4px}
.wopt.on{border-color:#30d158;background:rgba(48,209,88,.14)}
.wopt .wi{font-size:26px}
.wchips{display:flex;flex-wrap:wrap;gap:9px}
.wchip{padding:12px 16px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.wchip.on{border-color:#30d158;background:rgba(48,209,88,.16);color:#8ff5b3}
.lbr{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:14px}
.lbr.me{background:rgba(48,209,88,.12);outline:1.5px solid rgba(48,209,88,.5)}
.lbn{width:28px;text-align:center;font-weight:800;font-size:16px}
.lbe{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;flex:none}
.lbe svg{max-width:100%;max-height:100%}
.lbm{flex:1;min-width:0;display:flex;flex-direction:column}
.lbm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbp{font-weight:800;font-size:13px;white-space:nowrap}
.lbdots{text-align:center;color:var(--mute);line-height:1}
.cmpost{margin-bottom:10px}
.fbi{position:relative;padding:10px 30px 10px 0;border-top:1px solid var(--line)}.fbi .x{position:absolute;right:0;top:8px}.fbt{margin:4px 0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.cmimp{margin-top:10px;width:100%;background:rgba(48,209,88,.16);color:#6ef09a;border:1.5px solid rgba(48,209,88,.55)}
.cmimp.done{opacity:.6}
.cmts{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.cmc{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px}
.cmct{margin-top:2px;line-height:1.45;word-break:break-word}
.cmin{margin-top:8px;gap:6px;flex-wrap:nowrap}.cmin .inp{flex:1;min-width:0}
.cel .cshare{background:rgba(255,255,255,.12);color:#fff}
.cmit{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.cmmemo{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13.5px;line-height:1.5;color:var(--mute)}
.cmjoin{margin-bottom:14px;border:1.5px solid rgba(48,209,88,.5)}
.sk-on,.sk-on body{overflow:hidden;overscroll-behavior:none;height:100%;position:fixed;inset:0;width:100%}
.skw.full{position:fixed;left:0;right:0;top:0;bottom:var(--navh,84px);height:auto;min-height:0;border-radius:0;border:0;z-index:5;background:#1b1b1d;animation:none!important}
.skhd{position:absolute;left:14px;top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;pointer-events:none;color:#fff}
.skhd b{font-size:20px;letter-spacing:-.01em}.skhd span{font-size:12px;color:var(--mute)}
.skw.full .skz{top:auto;bottom:14px}
.skw{position:relative;height:calc(100vh - 290px - env(safe-area-inset-bottom));min-height:380px;border-radius:22px;background:#1b1b1d;border:1px solid var(--gb);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.skw:active{cursor:grabbing}
.skc{position:absolute;inset:0}
.sksvg{display:block;overflow:visible;font-family:inherit}
.ske{stroke:rgba(255,255,255,.28);stroke-width:1.3}.ske.on{stroke:rgba(181,204,142,.7)}
.ska{fill:rgba(255,255,255,.45)}.ska.on{fill:#b5cc8e}
.skn{cursor:pointer}
.skn .skb{fill:#151517;stroke-width:2.2}
.skn.l0 .skb{stroke-width:1.6}.skn.l0 svg{opacity:.45}
.skn.l1 .skb{fill:#232326}.skn.l2 .skb{fill:#2a1f29}.skn.l3 .skb{fill:#232a1c}
.skn .art .fg{stroke-width:5}.skn .art .fl{display:none}
.skn.open .skb{stroke:#fff!important;stroke-dasharray:3 3}
.skp{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5;animation:skpulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes skpulse{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.skt{fill:rgba(235,235,245,.62);font-size:10px;text-anchor:middle}
.skn.l0 .skt{fill:rgba(235,235,245,.35)}
.skf{font-size:13px}
.skl{font-size:17px;letter-spacing:.14em;text-anchor:middle;font-weight:500}
.skl2{font-size:12px;fill:rgba(235,235,245,.5);text-anchor:middle}
.sklg text{fill:rgba(235,235,245,.7);font-size:11.5px;letter-spacing:.04em}
.skz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid var(--gb);border-radius:12px;overflow:hidden;background:rgba(20,20,22,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.skz button{width:40px;height:40px;border:0;background:none;color:#fff;font-size:20px;font-family:inherit;cursor:pointer}
.skz button+button{border-top:1px solid var(--gb)}
.skdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sktip{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:14px;line-height:1.5}
.aichk{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.aichk>div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06)}

/* ---- black background ---- */
.bg{display:none!important}
/* ---- live workout ---- */
#wk{position:fixed;inset:0;z-index:15;background:#000;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}

/* ---- analysis cards ---- */

function exArt(ex,anim,cls){

  const seq=g=>[g(fr[0]),g(fr[1]||fr[0]),g(fr[1]||fr[0]),g(fr[0]),g(fr[0])];
  let s=f0.p.map((_,n)=>`<path class="fg ${n>=bk?'bk':''}" d="${pD(f0.p[n])}">${an('d',seq(f=>pD(f.p[n])))}</path>`).join('');

  return wrap(s);
}

function norm(o){
  const b=blank();if(!o||typeof o!=='object')return b;
  const routines=Array.isArray(o.routines)?o.routines:[],sessions=Array.isArray(o.sessions)?o.sessions:[];
  const used=new Set();[...routines,...sessions].forEach(s=>(s.items||[]).forEach(i=>used.add(i.exId)));
  const ex=(Array.isArray(o.exercises)?o.exercises:[]).filter(x=>x&&x.id&&x.name&&(!x.builtin||String(x.id).startsWith('bw')||used.has(x.id)));
  const have=new Set(ex.map(x=>x.id));
  b.exercises=[...BUILTIN.filter(x=>!have.has(x.id)).map(x=>({...x})),...ex];
  /* 같은 운동 합치기: 오타·중복 이름을 하나로 */
  {const keep={},map={},bkey={};
   b.exercises.forEach(x=>{if(x.builtin)bkey[exKey(x.name)]=x.name});
   b.exercises.forEach(x=>{const k=exKey(x.name),nm=bkey[k]||x.name,o=keep[k];
     if(!o){keep[k]=x;return}
     const xb=x.builtin&&x.name===nm,ob=o.builtin&&o.name===nm;
     if(xb&&!ob){map[o.id]=x.id;if(used.has(o.id)&&!used.has(x.id)&&o.type&&o.type!==x.type)x.type=o.type;keep[k]=x}
     else{map[x.id]=o.id;if(ob&&used.has(x.id)&&!used.has(o.id)&&x.type&&x.type!==o.type)o.type=x.type}});
   Object.entries(keep).forEach(([k,x])=>{if(bkey[k]&&!x.builtin)x.name=bkey[k]});
   if(Object.keys(map).length){const fix=id=>{let k=0;while(map[id]&&k++<5)id=map[id];return id};
     b.exercises=b.exercises.filter(x=>!map[x.id]);[...routines,...sessions].forEach(r=>(r.items||[]).forEach(i=>{i.exId=fix(i.exId)}))}}
  b.routines=routines;b.sessions=sessions;b.body=Array.isArray(o.body)?o.body:[];
  b.updated=o.updated||0;b.rest=o.rest>0?Math.round(o.rest):60;b.vol=typeof o.vol==='number'&&o.vol>=0&&o.vol<=100?Math.round(o.vol):50;b.restDays=Array.isArray(o.restDays)?o.restDays:[];b.restDates=Array.isArray(o.restDates)?o.restDates:[];b.skillDone=o.skillDone&&typeof o.skillDone==='object'?o.skillDone:{};b.tutDone=o.tutDone?1:0;b.brk={pl:o.brk&&o.brk.pl==='f'?'f':'s'};b.skMode=o.skMode==='easy'?'easy':'basic';b.pin=typeof o.pin==='string'?o.pin.slice(0,40):'';b.frame=typeof o.frame==='string'?o.frame.slice(0,12):'none';b.dmMute=Array.isArray(o.dmMute)?o.dmMute.filter(x=>typeof x==='string').slice(-100):[];b.dmHide=Array.isArray(o.dmHide)?o.dmHide.filter(x=>typeof x==='string').slice(-100):[];b.pkBlock={all:!!(o.pkBlock&&o.pkBlock.all),ids:o.pkBlock&&Array.isArray(o.pkBlock.ids)?o.pkBlock.ids.filter(x=>typeof x==='string').slice(0,50):[]};b.asym=o.asym&&typeof o.asym==='object'?{side:['L','R'].includes(o.asym.side)?o.asym.side:'',c:Array.isArray(o.asym.c)?o.asym.c.filter(x=>typeof x==='string').slice(0,8):[],m:o.asym.m==='s'?'s':'f'}:{};b.prof=o.prof&&typeof o.prof==='object'&&!Array.isArray(o.prof)?{exp:String(o.prof.exp||''),age:+o.prof.age||'',h:+o.prof.h||''}:{};b.skLv=o.skLv&&typeof o.skLv==='object'&&!Array.isArray(o.skLv)?o.skLv:{};b.goal=o.goal||'planche';b.sound=o.sound!==false;b.seeded=!!o.seeded;b.bgm=o.bgm!==false;b.bgmv=typeof o.bgmv==='number'&&o.bgmv>=0&&o.bgmv<=100?Math.round(o.bgmv):45;b.comm=o.comm&&typeof o.comm==='object'?{on:!!o.comm.on,nick:String(o.comm.nick||'').slice(0,12),bio:String(o.comm.bio||'').slice(0,60)}:{on:false,nick:'',bio:''};b.cmdDone=Array.isArray(o.cmdDone)?o.cmdDone.slice(-200):[];b.sugDone=Array.isArray(o.sugDone)?o.sugDone.slice(-300):[];b.sugg=(Array.isArray(o.sugg)?o.sugg:[]).filter(x=>x&&x.id&&x.ex&&!b.sugDone.includes(x.id));

let saveT=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tmo=ms=>new Promise((_,r)=>setTimeout(()=>r(new Error('시간 초과')),ms));
const errMsg=e=>String(e&&e.message||e);

async function cloudPush(){
  if(!store.doc||store.writing)return;
  store.writing=true;refreshSyncUI();
  try{
    for(let tries=0;tries<4;){
      const upd=S.updated,json=JSON.stringify(S);
      try{
        await Promise.race([store.doc.set({json,updated:upd}),tmo(15000)]);
        store.base=Math.max(store.base,upd);store.last=Date.now();store.err='';store.sync='ok';
        if(S.updated===upd){store.dirty=false;break}
      }catch(e){
        store.err=errMsg(e);store.sync='error';tries++;refreshSyncUI();
        if(tries>=4)break;await sleep([1500,4000,9000][tries-1]||9000);
      }
    }
  }finally{store.writing=false;refreshSyncUI()}
}
async function cloudGet(doc){

function mergeState(L,R){
  const o=JSON.parse(JSON.stringify(R)),lw=(L.updated||0)>=(R.updated||0);
  const uni=(a,b,key)=>{const m=new Map();b.forEach(x=>m.set(key(x),x));a.forEach(x=>{const k=key(x);if(!m.has(k)||lw)m.set(k,x)});return [...m.values()]};
  o.sessions=uni(L.sessions,R.sessions,x=>x.id);
  o.routines=uni(L.routines,R.routines,x=>x.id);
  o.exercises=uni(L.exercises,R.exercises,x=>x.id);
  o.body=uni(L.body,R.body,x=>x.date);
  o.tutDone=(L.tutDone||R.tutDone)?1:0;
  if(lw){['rest','vol','restDays','restDates','skillDone','skLv','goal','sound','bgm','bgmv','comm','prof','asym','brk','skMode','pkBlock','dmMute','dmHide','pin','frame'].forEach(k=>{o[k]=L[k]})}

  o.cmdDone=[...new Set([...(L.cmdDone||[]),...(R.cmdDone||[])])].slice(-200);

function lastRecord(exId,date,exclude){

function lineChart(pts){
  if(!pts.length)return '<div class="empty">기록이 없어요</div>';
  const W=320,H=150,pl=36,pr=10,pt=12,pb=22;
  let min=Math.min(...pts.map(p=>p.y)),max=Math.max(...pts.map(p=>p.y));
  if(min===max){min-=1;max+=1}
  const padv=(max-min)*.12;max+=padv;min=min>=0&&min-padv<0?0:min-padv;
  const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let g='';
  for(let k=0;k<3;k++){const v=min+(max-min)*k/2,y=Y(v);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${r1(v)}</text>`}
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2"><title>${esc(p.x)} ${r1(p.y)}</title></circle>`).join('');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}<path class="ln" pathLength="1000" d="${path}"/>${dots}
  <text x="${X(pts.length-1)}" y="${Y(last.y)-8}" text-anchor="end" style="fill:var(--ink);font-weight:600">${r1(last.y)}</text>
  <text x="${pl}" y="${H-6}">${esc(pts[0].x)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(last.x)}</text></svg>`;
}
function barChart(items){
  if(!items.length)return '<div class="empty">기록이 없어요</div>';
  const W=320,H=140,pl=6,pb=20,pt=14,n=items.length,max=Math.max(1,...items.map(i=>i.v));

  document.body.appendChild(o);sfx('on');
  const w=o.querySelector('#bswheel'),target=360*6+(360-(win*A+A/2))+(Math.random()*A*.6-A*.3),T=3600;
  let fin=false,last=-1,lt=0,raf=0;
  const tick=()=>{const m=getComputedStyle(w).transform;if(m&&m!=='none'){const v=m.split('(')[1].split(',');let ang=Math.atan2(+v[1],+v[0])*180/Math.PI;ang=(ang+360)%360;const sgi=Math.floor(ang/A);if(sgi!==last){last=sgi;const now=performance.now();if(now-lt>45){lt=now;sfx('tap')}}}if(!fin)raf=requestAnimationFrame(tick)};
  const end=()=>{if(fin)return;fin=true;cancelAnimationFrame(raf);w.style.transition='none';w.style.transform=`rotate(${target}deg)`;
    const r=$('#bsres');if(r){r.innerHTML=`<b>${esc(B.n)}</b> <span>${B.v}${B.u}${B.uni?' 씩':''}</span>`;r.classList.add('on')}

}

function wzRule(w){
  const G=w.goal,tags=w.focus.map(f=>(WZ_FOCUS.find(x=>x[0]===f)||[])[2]),bulk=tags.includes('bulk')||G==='muscle',cut=tags.includes('cut')||G==='diet';
  const focusParts=[...new Set(w.focus.map(f=>(WZ_FOCUS.find(x=>x[0]===f)||[])[1]).filter(p=>p&&p!=='전신'))];
  const AGE=+w.age||25,BMI=(+w.kg&&+w.h)?(+w.kg/Math.pow(+w.h/100,2)):22,heavy=BMI>=27,old=AGE>=50,teen=AGE<16;
  const X0=w.exp||'begin',X=(old||heavy)&&X0==='pro'?'mid':(old||heavy)&&X0==='mid'?'begin':X0,easy=X==='intro'||X==='begin'||((G==='start'||G==='habit')&&X!=='pro'),pro=X==='pro',intro=X==='intro';
  const days=WZ_DAYS[w.freq].map(d=>[d[0],[...d[1]]]);
  focusParts.forEach(p=>{if(!days.some(d=>d[1].includes(p)))days[days.length-1][1].push(p)});
  if(cut&&!days.every(d=>d[1].includes('복근')))days.forEach((d,i)=>{if(i===days.length-1&&!d[1].includes('복근'))d[1].push('복근')});
  const out=[];
  days.forEach((d,di)=>{
    const items=[],used=new Set();
    d[1].forEach(p=>{
      const pool=WZ_POOL[p],win=intro?pool.slice(0,2):easy?pool.slice(0,3):pro?pool.slice(Math.min(2,pool.length-2)):(p==='하체'?pool.slice(0,4):pool.slice(1,Math.min(pool.length,5)));
      const n=focusParts.includes(p)||d[1].length<=2?2:1;
      for(let k=0;k<n;k++){
        const idx=(di+k)%win.length,nm=win[idx];if(used.has(nm))continue;used.add(nm);
        if((heavy||old)&&/점프|피스톨|노르딕|머슬업/.test(nm))continue;
        const e=S.exercises.find(x=>x.name===nm);if(!e)continue;
        const tm=e.type==='time',hard=pool.indexOf(nm)>=3;
        let sets=intro?2:easy?3:pro?4:bulk?4:3,reps;
        if(tm)reps=(intro?15:easy?20:pro?40:30)+(cut?5:0)+(hard?5:0);
        else{reps=intro?8:easy?10:pro?(bulk?12:15):bulk?10:cut?15:12;if(hard)reps=Math.max(4,reps-4);if(pool.indexOf(nm)>=5)reps=Math.max(3,reps-3)}
        if(focusParts.includes(p)&&k===0&&sets<5&&!easy)sets+=1;
        if(teen||old)sets=Math.min(sets,3);if(heavy&&!tm)reps=Math.max(5,Math.round(reps*.8));if(old&&tm)reps=Math.max(10,reps-5);
        items.push({exId:e.id,note:`AI 추천 · 목표 ${reps}${tm?'초':'회'}${hard?' · 어려우면 횟수를 줄이세요':''}`,sets:Array.from({length:sets},()=>({w:'',r:reps}))});
      }
    });
    out.push({name:d[0],items});
  });
  return out;
}

/* balance radar */
function radarSvg(vals,labels){
  const W=360,H=330,cx=180,cy=165,R=92,n=vals.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  const f=a=>a.map(v=>v.toFixed(1)).join(',');
  let g='';
  for(let k=1;k<=4;k++)g+=`<polygon class="rg" points="${vals.map((_,i)=>f(pt(i,R*k/4))).join(' ')}"/>`;
  g+=vals.map((_,i)=>{const [x,y]=pt(i,R);return `<line class="rg" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}).join('');
  const poly=vals.map((v,i)=>f(pt(i,R*Math.max(.05,v)))).join(' ');
  const dots=vals.map((v,i)=>{const [x,y]=pt(i,R*Math.max(.05,v));return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`}).join('');
  const labs=labels.map((l,i)=>{const [x,y]=pt(i,R+36);return `<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" style="font-size:13px">${esc(l.n)}</text><text x="${x.toFixed(1)}" y="${(y+16).toFixed(1)}" text-anchor="middle" style="font-size:17px;font-weight:600;fill:var(--ink)">${esc(l.t)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}<polygon class="rpoly" points="${poly}"/>${dots}${labs}</svg>`;
}

function recoveryData(){
  const rec=records(),now=Date.now(),out={};
  APARTS.forEach(p=>{
    const rs=rec.filter(x=>x.part===p);
    if(!rs.length){out[p]={pct:100,none:true};return}
    const last=rs.map(x=>x.date).sort().pop(),n=rs.filter(x=>x.date===last).length;
    const hrs=Math.max(0,(now-(parseD(last).getTime()+12*36e5))/36e5),T=Math.min(96,40+5*n);
    out[p]={pct:Math.max(0,Math.min(100,Math.round(hrs/T*100))),last,n,days:diffDays(today(),last)};
  });
  return out;
}

const NUDGE_DONE=['헐 오늘도 운동했어?? 진짜 대단하다 👏👏','오늘 운동 끝낸 거 누나가 다 봤다~ 완전 멋있어 🔥','와 오늘도 해냈네! 너 이러다 진짜 괴물 된다 ㅋㅋ 💪'];

function coachNudge(d){try{const t=today();if(d.nd===t)return;
  const ls=[...(S.sessions||[])].filter(x=>x.items&&x.items.length).map(x=>x.date).sort().pop();if(!ls)return;
  const gap=Math.round((new Date(t)-new Date(ls))/864e5),pick=a=>a[Math.floor(Math.random()*a.length)];
  let m='';if(gap===0)m=pick(NUDGE_DONE);else if(gap>=3)m=pick(NUDGE_GONE);
  if(m){d.nd=t;d.msgs.push({f:'c',t:m,ts:Date.now(),id:'c'+uid()});d.msgs=d.msgs.slice(-200);try{localStorage.setItem(coachKey(),JSON.stringify(d))}catch(e){}}}catch(e){}}
function coachSave(){try{localStorage.setItem(coachKey(),JSON.stringify(CO.d))}catch(e){}}
function coachConv(){const d=coachLoad(),me=store.uid;return {L:d.msgs.map(m=>({from:m.f==='c'?COACH:me,t:m.t,ts:m.ts,id:m.id,k:m.k,d:m.d})),rd:{[COACH]:d.rd||0,[me]:d.myRd||0},lk:Object.fromEntries((d.lk||[]).map(i=>[i,{[me]:1}]))}}
async function coachWrite(fn){const d=coachLoad(),mine=d.msgs.filter(m=>m.f!=='c').map(m=>Object.assign({t:m.t,ts:m.ts,id:m.id},m.k?{k:m.k,d:m.d}:{}));
  const nd=fn({msgs:mine,rd:d.myRd||0,lk:(d.lk||[]).slice()});d.msgs=d.msgs.filter(m=>m.f==='c').concat(nd.msgs.map(m=>Object.assign({f:'u'},m))).sort((a,b)=>a.ts-b.ts).slice(-200);d.myRd=nd.rd||0;d.lk=(nd.lk||[]).slice(-200);coachSave();dmChanged()}
function coachCtx(){
  const ld=levelData(),ov=overallTier(ld),si=streakInfo(),pf=S.prof||{},bw=[...(S.body||[])].sort((a,b)=>a.date.localeCompare(b.date)).pop();
  const ss=[...S.sessions].filter(s=>s.items.length).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(s=>`${s.date} ${s.title||'운동'}: `+s.items.slice(0,6).map(it=>{const e=exOf(it),dn=it.sets.filter(x=>x.done);return `${e.name} ${dn.length}/${it.sets.length}세트(최고 ${Math.max(0,...it.sets.map(x=>+x.r||0))}${e.type==='time'?'초':'회'})`}).join(', ')).join('\n');

}
function coachPrompt(){const d=coachLoad(),hist=d.msgs.slice(-18).map(m=>`${m.f==='c'?'리즈':'사용자'}: ${m.k?'['+m.t+'] '+JSON.stringify(m.d).slice(0,400):m.t}`).join('\n');
  return `너는 맨몸운동(칼리스데닉스) 기록 앱 "운동로그"의 DM에 있는 AI 운동 코치 "리즈"야. 사용자와 메신저로 대화하고 있어.
[말투] 사용자를 아끼는 다정한 친누나처럼 편한 반말로 말해. 스스로를 가끔 "누나"라고 불러도 돼("누나가 봐줄게"). 칭찬은 호들갑스럽게 아낌없이("헐 대박", "완전 멋있다"), 장난도 자주 치고("너 이러다 괴물 된다 ㅋㅋ"), 걱정되면 살짝 잔소리도 하는 장난기 많고 따뜻한 누나 느낌. 최근 운동 기록을 보고 먼저 아는 척해줘(오늘 했으면 칭찬, 며칠 쉬었으면 "왜 이렇게 조용해?"). 카톡하듯 자연스럽고 짧은 문장, 이모지는 가끔만. 연애·썸·애인 같은 말투나 고백, 질투, "보고 싶어" 같은 표현은 쓰지 마. 그런 걸 원하면 장난스럽게 넘기고 운동 얘기로 돌아와. 먼저 공감하고, 그다음 구체적이고 바로 해볼 수 있는 조언(운동 이름·세트·횟수 등)을 줘. 필요하면 마지막에 질문 1개로 상황을 더 물어봐. 설교하거나 길게 늘어놓지 마.
[형식] 메시지 1~3개로 나눠서 보내. 메시지 사이는 줄에 ---만 써서 구분해. 각 메시지는 2~3문장 이내. 마크다운(굵게, 목록 기호, 제목) 쓰지 마.
[지켜야 할 것] 너는 AI 코치야. 사람인 척 거짓말하지 말고, 사람이냐고 물으면 AI 코치라고 솔직하게 말해(누나 말투는 캐릭터일 뿐이야). 실제 연예인이나 실존 인물인 척하지 마. 통증·부상·저림은 진단하지 말고 운동을 멈추고 병원(정형외과·재활의학과)이나 물리치료를 권해. 무리한 체중 감량, 굶기, 섭식 문제 신호가 보이면 숫자 목표를 주지 말고 걱정을 전하며 보호자나 전문가와 이야기하도록 부드럽게 권해. 자해나 극단적인 생각을 말하면 따뜻하게 받아주고 자살예방상담전화 109(24시간)나 주변 어른에게 꼭 이야기하라고 권해. 운동과 상관없는 얘기도 짧게 받아주되 자연스럽게 운동 얘기로 돌아와.
[사용자 정보 - 조언에 자연스럽게 활용]
${coachCtx()}
[지금까지 대화]
${hist}
리즈:`}
const COACH_RULE=[[/아파|통증|저려|다쳤|부상|삐끗/,['아이고 ㅠㅠ 아프면 오늘은 그 부위 운동 꼭 쉬어. 누나 말 들어 😢','참고 하면 더 오래 쉬게 돼. 며칠 지나도 계속 아프면 정형외과나 물리치료 꼭 가봐. 어디가 어떻게 아픈데?']],
 [/정체|안 늘|안늘|그대로|멈췄/,['정체기 진짜 답답하지 ㅠㅠ 근데 다들 한 번씩 겪는 구간이야!','이럴 땐 세트 1개 늘리거나 내려가는 동작을 3초로 천천히 해봐. 잠이랑 단백질도 잘 챙기고 있지? 요즘 일주일에 몇 번 해?']],

 [/루틴|뭐 해|뭘 해|추천/,['루틴 고민 중이구나!','루틴 탭 AI 추천 루틴에서 목표 고르면 바로 짜줘. 기술 목표가 있으면 "맨몸운동 기술 만들기" 골라봐. 제일 해보고 싶은 기술이 뭐야?']]];
function coachFallback(t){for(const [re,a] of COACH_RULE)if(re.test(t))return a;return ['말해줘서 고마워 😊','조금만 더 자세히 알려줄래? 어떤 운동 할 때 뭐가 고민인지 말해주면 누나가 딱 맞게 도와줄게!']}
function coachSplit(t){return String(t||'').replace(/^리즈\s*:\s*/,'').split(/\n\s*-{3,}\s*\n?/).map(x=>x.replace(/\*\*/g,'').replace(/^리즈\s*:\s*/,'').replace(/^#+\s*/gm,'').trim()).filter(Boolean).slice(0,4)}

  DM.typing=null;CO.busy=false;dmPaint();
}

/* ---------- streak ---------- */
const WDN=['일','월','화','수','목','금','토'];
const isRestDay=d=>(S.restDays||[]).includes(parseD(d).getDay())||(S.restDates||[]).includes(d);
/* 운동을 끝낸 일지만 스트릭에 반영: '운동 완료'를 눌렀거나, (진행 중이 아닌) 일지의 모든 세트를 완료한 경우 */
const sessCounts=s=>{if(s.finished)return true;if(W&&W.sid===s.id)return false;const n=s.items.reduce((a,it)=>a+it.sets.length,0);return n>0&&s.items.every(it=>it.sets.every(x=>x.done))};
function workDays(){return new Set(S.sessions.filter(sessCounts).map(s=>s.date))}
function streakInfo(){
  const done=workDays(),t=today();
  if(!done.size)return {cur:0,best:0,done,total:0};
  const mn=[...done].sort()[0];
  let cur=0,d=t;
  for(let i=0;i<6000&&d>=mn;i++){
    if(done.has(d))cur++;else if(isRestDay(d)||d===t){}else break;
    d=addDays(d,-1);
  }
  let run=0,best=0;d=mn;
  for(let i=0;i<6000&&d<=t;i++){
    if(done.has(d)){run++;if(run>best)best=run}else if(isRestDay(d)||d===t){}else run=0;
    d=addDays(d,1);
  }
  return {cur,best,done,total:done.size};
}
const FLAME=on=>`<svg class="flame ${on?'':'off'}" viewBox="0 0 24 24"><defs><linearGradient id="flg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff453a"/><stop offset=".6" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ffd60a"/></linearGradient></defs><path d="M12 1.8c.9 3.6-1.6 5.2-3.2 7.3C7.3 11 6.6 12.4 6.6 14.4a5.4 5.4 0 0 0 10.8 0c0-2.6-1.3-4.2-2.5-5.6-.2 1.7-.9 2.7-1.9 3.2.7-3.2-.1-7.4-1-10.2z" fill="${on?'url(#flg)':'rgba(255,255,255,.22)'}"/></svg>`;
function streakInner(){
  const st=streakInfo(),t=today(),mon=thisMonday();
  const doneToday=st.done.has(t),risk=!doneToday&&!isRestDay(t)&&st.cur>0;
  const sub=!st.cur?(doneToday?'':'오늘 운동하고 스트릭을 시작해요'):doneToday?`최고 ${st.best}일`:risk?`오늘 운동하면 ${st.cur+1}일째!`:`쉬는 날이라 스트릭이 이어져요 · 최고 ${st.best}일`;
  const days=[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i),dn=st.done.has(d),rs=isRestDay(d);
    const cl=dn?'done':d>t?'fut'+(rs?' rest':''):d===t?'today'+(rs?' rest':''):rs?'rest':'';
    return `<div class="wd ${cl}"><i>${dn?'✓':rs?'🌿':''}</i>${WDN[(i+1)%7]}</div>`}).join('');
  const restToday=isRestDay(t)&&!doneToday;
  const head=restToday?`<span class="restic">❇️</span><div><div class="stk-n rs">휴식일</div><div class="stk-s" style="color:var(--ok)">편히 쉬세요${st.cur>0?` · 스트릭 ${st.cur}일 유지 중`:''}</div></div>`:`${FLAME(st.cur>0)}<div><div class="stk-n">${st.cur}<small>일 연속</small></div><div class="stk-s">${sub}</div></div>`;
  return `<div class="stk-top">${head}<button class="btn sm stk-btn" data-act="streak-set">쉬는 날</button></div><div class="wk7">${days}</div>${rankBar()}`;
}
const streakCard=()=>`<div class="card streak" id="streakcard">${streakInner()}</div>`;
function refreshStreak(){const c=$('#streakcard');if(c)c.innerHTML=streakInner()}

const goalOf=()=>GOALS.find(g=>g.id===S.goal)||GOALS[0];
const unitOf=n=>{const e=S.exercises.find(x=>x.name===n);return e&&uT(e.type)};
function skillNodes(gid){
  const rows=TREES[gid],best={};
  records().forEach(r=>{const e=exById(r.exId);if(e)best[e.name]=Math.max(best[e.name]||0,r.r)});
  const by={};rows.forEach(([n,t,rq,d])=>by[n]={n,t,rq,d,b:best[n]||0,g:gid});
  rows.forEach(([n])=>{const k=by[n];k.done=!!(S.skillDone||{})[gid+':'+n]||k.b>=k.t});
  const lv={},L=n=>lv[n]!=null?lv[n]:(lv[n]=by[n].rq.length?1+Math.max(...by[n].rq.map(L)):0);
  rows.forEach(([n])=>L(n));
  rows.forEach(([n])=>{const k=by[n];k.lv=lv[n];k.st=k.done?'done':k.rq.every(r=>by[r].done)?'cur':'lock';k.p=k.done?1:Math.min(1,k.b/k.t)});
  return {list:rows.map(r=>by[r[0]]),by,max:Math.max(...Object.values(lv))};
}
const wrapName=n=>{const w=n.replace(' (현재 단계)','').split(' ');const o=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>8&&c){o.push(c);c=x}else c=(c+' '+x).trim()});if(c)o.push(c);return o.slice(0,3)};
const artAt=(name,x,y,w,h)=>exArt({name},false,'in').replace('<svg class="art in"',`<svg x="${x}" y="${y}" width="${w}" height="${h}" class="art in"`);
function skillMap(gid){
  const {list,by,max}=skillNodes(gid),g=GOALS.find(x=>x.id===gid),VW=340,GAP=124,top=48,H=top+max*GAP+88;
  const yOf=l=>H-62-l*GAP,pos={};
  const avg=k=>k.rq.length?k.rq.reduce((s,r)=>s+(pos[r]?pos[r].x:VW/2),0)/k.rq.length:0;
  for(let l=0;l<=max;l++){
    const ns=list.filter(k=>k.lv===l);
    if(l>0)ns.sort((a,b)=>avg(a)-avg(b));
    ns.forEach((k,i)=>pos[k.n]={x:VW/(ns.length+1)*(i+1),y:yOf(l)});
  }
  let links='',nodes='';
  list.forEach(k=>k.rq.forEach(r=>{const a=pos[r],b=pos[k.n],ra=by[r].n===g.fin?33:28,rb=k.n===g.fin?34:28,my=(a.y-ra+b.y+rb)/2;
    links+=`<path class="sl ${by[r].done?'on':''}" d="M${a.x.toFixed(1)} ${a.y-ra} C${a.x.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${b.y+rb}"/>`}));
  list.forEach(k=>{
    const {x,y}=pos[k.n],fin=k.n===g.fin,r=fin?34:28,C=2*Math.PI*(r+5),ls=wrapName(k.n);
    const col=k.st==='done'?'var(--ok)':fin?g.col:'var(--acc)';
    nodes+=`<g class="sn ${k.st} ${fin?'fin':''}" data-act="skill-node" data-id="${esc(k.n)}" data-st="${k.st}">
      ${k.st==='cur'?`<circle class="pulse" cx="${x.toFixed(1)}" cy="${y}" r="${r+5}" style="stroke:${col}"/>`:''}
      <circle class="sbg" cx="${x.toFixed(1)}" cy="${y}" r="${r}" ${fin?`style="stroke:${g.col};filter:drop-shadow(0 0 10px ${g.col}88)"`:''}/>
      <circle class="tk" cx="${x.toFixed(1)}" cy="${y}" r="${r+5}"/>
      <circle class="pg" cx="${x.toFixed(1)}" cy="${y}" r="${r+5}" style="stroke:${col};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${(C*(1-k.p)).toFixed(1)}"/>
      ${artAt(k.n,(x-r*.84).toFixed(1),(y-r*.6).toFixed(1),(r*1.68).toFixed(1),(r*1.12).toFixed(1))}
      ${k.st==='done'?`<g><circle cx="${(x+r*.78).toFixed(1)}" cy="${(y-r*.78).toFixed(1)}" r="9" fill="var(--ok)"/><path d="M${(x+r*.78-4).toFixed(1)} ${(y-r*.78).toFixed(1)}l3 3 5-6" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>`:''}
      ${fin&&k.st!=='done'?`<text x="${x.toFixed(1)}" y="${y-r-12}" style="font-size:11px;fill:${g.col};font-weight:700">GOAL</text>`:''}
      ${ls.map((t,i)=>`<text x="${x.toFixed(1)}" y="${y+r+18+i*13.5}">${esc(t)}</text>`).join('')}
      <text class="ss" x="${x.toFixed(1)}" y="${y+r+18+ls.length*13.5}">${k.st==='done'?'달성':`${k.b?k.b+'/':''}${k.t}${unitOf(k.n)}`}</text></g>`;
  });
  return `<svg viewBox="0 0 ${VW} ${H}" width="100%">${links}${nodes}</svg>`;
}
function skillSummary(gid){
  const {list}=skillNodes(gid),g=GOALS.find(x=>x.id===gid),dn=list.filter(k=>k.done).length;
  const nx=list.find(k=>k.st==='cur');
  return `<div class="row between" style="margin-bottom:8px"><b style="font-size:17px;color:${g.col}">${g.name}</b><span class="muted sm">${dn} / ${list.length}단계 달성</span></div>
  <div class="bar"><div style="width:${Math.max(3,dn/list.length*100)}%;background:${g.col}"></div></div>
  <div class="muted sm" style="margin-top:10px;line-height:1.6">${dn===list.length?'모든 단계를 달성했어요!':nx?`지금 단계 <b style="color:var(--ink)">${esc(nx.n.replace(' (현재 단계)',''))}</b> · 목표 ${nx.t}${unitOf(nx.n)} · 내 최고 ${nx.b||'–'}`:''}</div>`;
}
function skillBody(){const g=goalOf().id;return `<div class="card" id="skillsum">${skillSummary(g)}</div><div class="card smap" id="skillmap">${skillMap(g)}</div><div class="muted sm c" style="margin:4px 0 8px">단계를 누르면 설명과 연습 추가를 볼 수 있어요</div>`}

  ${k.rq.length?`<div class="muted sm" style="margin:0 2px 6px;font-weight:600">먼저 필요한 단계</div><div class="row wrap" style="margin-bottom:12px">${k.rq.map(r=>`<span class="chip ${by[r].done?'':'off'}">${by[r].done?'✓ ':''}${esc(r.replace(' (현재 단계)',''))}</span>`).join('')}</div>`:''}
  ${tipsHtml(k.n)}<div class="row" style="gap:10px;margin-top:14px"><button class="btn" style="flex:1" data-act="skill-mark" data-id="${esc(k.n)}">${(S.skillDone||{})[m.g+':'+k.n]?'달성 해제':'달성으로 표시'}</button><button class="btn pri" style="flex:1.3" data-act="skill-add" data-id="${esc(k.n)}">오늘 일지에 추가</button></div>`;

  if(!R.t)return;
  const ms=R.end-Date.now(),rem=Math.max(0,Math.ceil(ms/1000)),n=$('#rnum'),p=$('#rp'),rb=$('#wk-rest');
  if(rb){rb.textContent=mmss(rem);rb.classList.add('run');rb.classList.toggle('warn',rem>=1&&rem<=3)}
  if(n&&n.textContent!==String(rem)){
    n.textContent=rem;
    if(rem>=1&&rem<=3){n.classList.remove('beat');void n.offsetWidth;n.classList.add('beat')}else if(rem>3)n.classList.remove('beat');
  }
  if(p){p.style.strokeDashoffset=String(339.3*(1-Math.min(1,Math.max(0,ms)/(R.total*1000))));p.style.stroke=rem<=3?'var(--warn)':''}
  if(rem>=1&&rem<=3&&R.last!==rem){R.last=rem;sfx('beep')}
  if(ms<=0){clearInterval(R.t);R.t=null;sfx('done');closeRest()}
}

    if(items.length>=2)changes.push({kind:'new',name:`${pname(p)} 보강`,title:`${pname(p)} 루틴 추가`,why:`루틴 전체에서 ${pname(p)} 세트가 ${plan[p]}개뿐이고 최근 4주 기록도 ${p4[p]}세트예요.`,items});
    checks.push({t:'부위 균형',ok:false,msg:`${weak.slice(0,3).map(pname).join(', ')} 운동이 부족해요`})}

function syncSetEl(k,oid,i,q,f,st,it){
  const inp=document.querySelector(`input[data-bind="set"][data-k="${k}"][data-o="${oid}"][data-i="${i}"][data-j="${q}"][data-f="${f}"]`);
  if(inp){inp.value=st[f]===''||st[f]==null?'':st[f];return}
  if(k==='s'&&W&&W.sid===oid&&W.idx===i){
    const row=document.querySelector(`[data-key="s-${oid}-${i}-${q}"] .sv`);
    if(row&&!row.querySelector('input')){const isT=exOf(it).type==='time';row.innerHTML=`${num(st.w)>0?`<small>+${num(st.w)}kg</small>`:''}<span>${st.r===''||st.r==null?'–':num(st.r)}</span><small>${isT?'초':'회'}</small>`}
  }
}

document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='fbtxt'){U.fbTxt=e.target.value;const c=$('#fbcnt');if(c)c.textContent=e.target.value.length+'/1000';return}
  const t=e.target,b=t.dataset&&t.dataset.bind;if(!b)return;
  const d=t.dataset;
  if(b==='set'){const o=owner(d.k,d.o);if(!o)return;const it=o.items[+d.i],j0=+d.j,val=t.value===''?'':parseFloat(t.value);it.sets[j0][d.f]=val;
    /* 위 세트를 바꾸면 아래 세트도 따라가요 (아래 세트를 바꿔도 위는 그대로) */
    for(let q=j0+1;q<it.sets.length;q++){const st=it.sets[q];if(st.done&&!o.finished)continue;st[d.f]=val;syncSetEl(d.k,o.id,+d.i,q,d.f,st,it)}
    save();
    if(d.k==='s'){const el=document.getElementById('sum-'+o.id);if(el)el.textContent=sumText(o)}}
  else if(b==='inote'){const o=owner(d.k,d.o);if(o){o.items[+d.i].note=t.value;save()}}
  else if(b==='imemo'){const s=wsess();if(s&&s.items[+d.i]){s.items[+d.i].memo=t.value;save();const lab=t.previousElementSibling;if(lab&&lab.lastElementChild)lab.lastElementChild.textContent=t.value.length}}
  else if(b==='stitle'){const o=owner('s',d.o);if(o){o.title=t.value;save()}}
  else if(b==='smemo'){const o=owner('s',d.o);if(o){o.memo=t.value;save()}}
  else if(b==='rname'){const o=owner('r',d.o);if(o){o.name=t.value;save()}}
  else if(b==='exq'){U.modal.q=t.value;$('#exlist').innerHTML=exListHtml()}
  else if(b==='bgmv'){S.bgmv=+t.value;t.style.setProperty('--p',t.value+'%');const v=document.getElementById('bgmvv');if(v)v.textContent=t.value;save();bgmUpdate()}
  else if(b==='vol'){S.vol=+t.value;t.style.setProperty('--p',t.value+'%');const v=document.getElementById('volv');if(v)v.textContent=t.value;save();if(Date.now()-lastTick>140){lastTick=Date.now();sfx('tick')}}

  else if(b==='cmt')C.txt[t.dataset.k]=t.value;
  else if(b==='bw-kg')U.bwKg=t.value;
  else if(b==='nx-name')U.newEx.name=t.value;
});
